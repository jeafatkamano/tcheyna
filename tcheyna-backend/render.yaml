# render.yaml — Déploiement automatique Tcheyna sur Render
# Doc : https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tcheyna-api
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    rootDirectory: tcheyna

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app

    healthCheckPath: /health

    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # À renseigner manuellement dans le dashboard
      - key: CORS_ORIGINS
        value: "https://tcheyna.onrender.com"
      - key: AT_API_KEY
        value: ""
      - key: AT_USERNAME
        value: sandbox
      - key: CINETPAY_API_KEY
        value: ""
      - key: CINETPAY_SITE_ID
        value: ""
      - key: UPLOAD_FOLDER
        value: uploads

# Frontend static site (séparé) - doit être un élément de la liste `services`
  - type: static-site
    name: tcheyna-frontend
    region: frankfurt
    branch: main
    rootDirectory: .

    # Build command: install deps and build the Vite app into /dist
    buildCommand: npm install && npm run build

    # directory to publish
    staticPublishPath: dist

    # Environment variables to set in Render (VITE_API_URL should point to the API URL)
    envVars:
      - key: VITE_API_URL
        value: "https://tcheyna-api.onrender.com/api"
